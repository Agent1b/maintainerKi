name: Bug report
description: Report a reproducible problem in the beta self-hosted stack
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        maintainerKi is currently a **beta, self-hosted, GitHub App-based** project. Please keep reports scoped and reproducible.

        **Do not use this form for security issues or secret exposure.** If the bug could expose credentials, bypass auth, break webhook verification, or otherwise create a security risk, stop here and follow the private reporting process in `SECURITY.md` instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you continue
      options:
        - label: I searched existing issues and the docs first.
          required: true
        - label: This report is not a public security disclosure. If it is security-sensitive, I will use the private process in SECURITY.md instead.
          required: true

  - type: dropdown
    id: deployment_mode
    attributes:
      label: Deployment mode
      description: How are you running maintainerKi?
      options:
        - Local development
        - Packaged Docker Compose
        - Hosted compose overlay
        - Other self-hosted setup
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, commit SHA, or branch name.
      placeholder: main @ abc1234
    validations:
      required: true

  - type: dropdown
    id: scoring_provider
    attributes:
      label: Scoring provider
      description: Which provider was active when the bug happened?
      options:
        - mock
        - ollama
        - mlx
        - Not sure / not applicable
    validations:
      required: true

  - type: dropdown
    id: duplicate_provider
    attributes:
      label: Duplicate detection provider
      options:
        - hashing
        - sentence-transformers
        - Disabled / not applicable
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest repeatable sequence.
      placeholder: |
        1. Start the stack with ...
        2. Open ...
        3. Trigger ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The webhook should be accepted and appear in the dashboard inbox.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The webhook returns 500 and the worker never processes the contribution.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or tracebacks
      description: Paste the smallest useful excerpt. Redact secrets before posting.
      render: shell
      placeholder: Paste server, worker, dashboard, or compose logs here.
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Sanitized config context
      description: Include only relevant environment or deployment details. Do not paste secrets, private keys, or full `.env` files.
      render: shell
      placeholder: |
        APP_ENV=production
        SCORER_PROVIDER=ollama
        DUPLICATE_EMBEDDING_PROVIDER=hashing
    validations:
      required: false
