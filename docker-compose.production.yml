services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${MAINTAINERKI_ENV_FILE:-.env.production}
    volumes:
      - production-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_SEMANTIC_DUPLICATES: ${INSTALL_SEMANTIC_DUPLICATES:-false}
    restart: "no"
    env_file:
      - ${MAINTAINERKI_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command:
      [
        "python",
        "-c",
        "from server.db import init_database, run_database_migrations; init_database(); run_database_migrations()"
      ]

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_SEMANTIC_DUPLICATES: ${INSTALL_SEMANTIC_DUPLICATES:-false}
    restart: unless-stopped
    env_file:
      - ${MAINTAINERKI_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HF_HOME: /tmp/huggingface
    volumes:
      - ${GITHUB_PRIVATE_KEY_HOST_PATH}:${GITHUB_PRIVATE_KEY_PATH}:ro
      - production-model-cache:/tmp/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz')); assert data['status']=='ok'"
        ]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_SEMANTIC_DUPLICATES: ${INSTALL_SEMANTIC_DUPLICATES:-false}
    restart: unless-stopped
    env_file:
      - ${MAINTAINERKI_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HF_HOME: /tmp/huggingface
    volumes:
      - ${GITHUB_PRIVATE_KEY_HOST_PATH}:${GITHUB_PRIVATE_KEY_PATH}:ro
      - production-model-cache:/tmp/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["celery", "-A", "worker.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from worker.celery_app import celery_app; import sys; replies=(celery_app.control.inspect(timeout=5).ping() or {}); sys.exit(0 if replies else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"

volumes:
  production-pgdata:
  production-redisdata:
  production-model-cache:
